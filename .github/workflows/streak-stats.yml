name: Update Streak Stats

on:
  schedule:
    # Runs automatically every day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: # Allows you to manually run it from the "Actions" tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # --- YOUR SNIPPET GOES HERE ---
      - name: GitHub Readme Streak Stats Action
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: 'user=${{ github.repository_owner }}&theme=github-dark'
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step to commit the generated graphic back to your repository
      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
